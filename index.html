<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- 让网页不要用旧的兼容模式，而是用最新、最标准的方式显示(这行代码可以去除) -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <!-- 尽量使用 WebKit 内核来显示页面,不需要兼容老浏览器可以删除 -->
  <meta name="renderer" content="webkit">
  <!-- 让网页在手机上按“正常大小全屏显示”，并且禁止用户缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>%VITE_APP_TITLE%</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --loader-bg: #fcf6ed;
      --loader-text: #312e29;
      --loader-muted: rgba(49, 46, 41, 0.65);

      --loader-primary: #914539;
      --loader-primary-container: #fe9c8c;
      --loader-secondary-container: #9ae1ff;
      --loader-tertiary-container: #9bff9b;

      --loader-card: rgba(255, 255, 255, 0.55);
      --loader-card-border: rgba(145, 69, 57, 0.16);
    }

    html.dark {
      --loader-bg: #0b0e18;
      --loader-text: #ececfd;
      --loader-muted: rgba(236, 236, 253, 0.7);
      --loader-primary: #ff85c9;
      --loader-primary-container: #f672be;
      --loader-secondary-container: #8debff;
      --loader-tertiary-container: #cca8ff;
      --loader-card: rgba(34, 37, 53, 0.58);
      --loader-card-border: rgba(255, 133, 201, 0.18);
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(1200px 700px at 20% 15%, rgba(254, 156, 140, 0.18), transparent 60%),
        radial-gradient(900px 520px at 85% 20%, rgba(154, 225, 255, 0.18), transparent 55%),
        radial-gradient(900px 650px at 20% 85%, rgba(155, 255, 155, 0.14), transparent 55%),
        var(--loader-bg);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', Helvetica Neue, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
      color: var(--loader-text);
    }

    #loader-wrapper::before,
    #loader-wrapper::after {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 9999px;
      filter: blur(70px);
      opacity: 0.75;
      transform: translateZ(0);
      animation: loaderFloat 6.5s ease-in-out infinite;
      pointer-events: none;
    }

    #loader-wrapper::before {
      left: -140px;
      top: -160px;
      background: radial-gradient(circle at 30% 30%, var(--loader-primary-container), transparent 60%),
        radial-gradient(circle at 70% 70%, var(--loader-secondary-container), transparent 55%);
    }

    #loader-wrapper::after {
      right: -160px;
      bottom: -180px;
      background: radial-gradient(circle at 30% 40%, var(--loader-tertiary-container), transparent 60%),
        radial-gradient(circle at 70% 70%, var(--loader-primary-container), transparent 55%);
      animation-delay: -2.2s;
    }

    .loader-section {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        linear-gradient(90deg, transparent, rgba(145, 69, 57, 0.65), transparent),
        radial-gradient(closest-side, rgba(145, 69, 57, 0.35), transparent);
      background-size: 320px 2px, 520px 520px;
      background-repeat: no-repeat;
      animation: loaderSweep 1.8s ease-in-out infinite;
    }

    html.dark .loader-section {
      background-image:
        linear-gradient(90deg, transparent, rgba(255, 133, 201, 0.75), transparent),
        radial-gradient(closest-side, rgba(141, 235, 255, 0.25), transparent);
    }

    .loader-section.section-left {
      background-position: 20% 40%, 20% 55%;
    }

    .loader-section.section-right {
      background-position: 80% 60%, 80% 45%;
      animation-delay: -0.9s;
    }

    #loader {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 9999px;
      filter: drop-shadow(0 18px 35px rgba(145, 69, 57, 0.12));
    }

    #loader .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: conic-gradient(from 180deg,
          rgba(0, 0, 0, 0) 0deg,
          var(--loader-primary-container) 70deg,
          var(--loader-secondary-container) 160deg,
          var(--loader-tertiary-container) 250deg,
          var(--loader-primary-container) 360deg);
      -webkit-mask: radial-gradient(closest-side, transparent 66%, #000 67%);
      mask: radial-gradient(closest-side, transparent 66%, #000 67%);
      animation: loaderSpin 1.05s linear infinite;
      opacity: 0.95;
      z-index: 0;
      pointer-events: none;
    }

    #loader .loader-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76px;
      height: 30px;
      transform: translate(-50%, -50%);
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(145, 69, 57, 0.18));
      animation: neonFlicker 2.6s infinite;
      z-index: 2;
      user-select: none;
      -webkit-user-drag: none;
    }

    html.dark #loader .loader-logo {
      filter: drop-shadow(0 12px 28px rgba(255, 133, 201, 0.22));
    }

    #loader::before {
      content: '';
      position: absolute;
      inset: 11px;
      border-radius: inherit;
      background: var(--loader-card);
      border: 1px solid var(--loader-card-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.06);
      z-index: 1;
    }

    #loader::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      background: radial-gradient(closest-side,
          rgba(254, 156, 140, 0.55),
          rgba(154, 225, 255, 0.22) 45%,
          rgba(155, 255, 155, 0.18) 65%,
          rgba(0, 0, 0, 0) 72%);
      filter: blur(2px);
      opacity: 0.75;
      animation: neonFlickerSlow 2.9s infinite;
      z-index: -1;
    }

    html.dark #loader {
      filter: drop-shadow(0 18px 35px rgba(255, 133, 201, 0.12));
    }

    html.dark #loader::after {
      background: radial-gradient(closest-side,
          rgba(255, 133, 201, 0.55),
          rgba(141, 235, 255, 0.24) 45%,
          rgba(204, 168, 255, 0.2) 65%,
          rgba(0, 0, 0, 0) 72%);
    }

    .load_title {
      margin-top: 18px;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 14px;
      color: var(--loader-muted);
      user-select: none;
      text-shadow: 0 10px 35px rgba(145, 69, 57, 0.14);
    }

    .load_title::before {
      content: 'Pet Sanctuary';
      display: block;
      font-weight: 900;
      font-size: 22px;
      line-height: 1.1;
      margin-bottom: 8px;
      color: transparent;
      background: linear-gradient(90deg,
          var(--loader-primary) 0%,
          var(--loader-primary-container) 28%,
          var(--loader-secondary-container) 55%,
          var(--loader-tertiary-container) 78%,
          var(--loader-primary) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: none;
      animation: titleGradient 2.8s ease-in-out infinite;
    }

    @keyframes titleGradient {
      0% {
        background-position: 0% 50%;
        filter: drop-shadow(0 10px 28px rgba(145, 69, 57, 0.12));
      }

      50% {
        background-position: 100% 50%;
        filter: drop-shadow(0 14px 34px rgba(254, 156, 140, 0.14));
      }

      100% {
        background-position: 0% 50%;
        filter: drop-shadow(0 10px 28px rgba(154, 225, 255, 0.12));
      }
    }

    @keyframes neonFlicker {

      0%,
      7% {
        opacity: 1;
        filter: drop-shadow(0 10px 25px rgba(145, 69, 57, 0.22));
      }

      8% {
        opacity: 0.55;
        filter: drop-shadow(0 0 0 rgba(145, 69, 57, 0));
      }

      10% {
        opacity: 0.95;
        filter: drop-shadow(0 12px 30px rgba(145, 69, 57, 0.24));
      }

      12% {
        opacity: 0.7;
      }

      15%,
      62% {
        opacity: 1;
        filter: drop-shadow(0 16px 36px rgba(254, 156, 140, 0.25));
      }

      63% {
        opacity: 0.6;
      }

      66% {
        opacity: 1;
      }

      92% {
        opacity: 0.78;
      }

      100% {
        opacity: 1;
        filter: drop-shadow(0 12px 30px rgba(154, 225, 255, 0.22));
      }
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes neonFlickerSlow {

      0%,
      100% {
        opacity: 0.76;
        transform: translateZ(0) scale(1);
      }

      12% {
        opacity: 0.42;
        transform: translateZ(0) scale(0.992);
      }

      18% {
        opacity: 0.82;
        transform: translateZ(0) scale(1.006);
      }

      47% {
        opacity: 0.62;
      }

      52% {
        opacity: 0.86;
      }

      78% {
        opacity: 0.54;
      }
    }

    @keyframes loaderFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(0, 22px, 0) scale(1.04);
      }
    }

    @keyframes loaderSweep {
      0% {
        transform: translate3d(0, -10px, 0);
        opacity: 0.08;
      }

      50% {
        transform: translate3d(0, 10px, 0);
        opacity: 0.16;
      }

      100% {
        transform: translate3d(0, -10px, 0);
        opacity: 0.08;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #loader,
      #loader::after,
      #loader-wrapper::before,
      #loader-wrapper::after,
      .loader-section {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader">
        <div class="loader-ring"></div>
        <img class="loader-logo" src="/src/assets/logo/logo.png" alt="logo" />
      </div>
      <div class="loader-section section-left"></div>
      <div class="loader-section section-right"></div>
      <div class="load_title">正在加载系统资源，请耐心等待</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
